# Managed by setup-bash-workstation. Runtime detection belongs to Starship.
add_newline = false
format = '$directory$git_branch$git_status$bun$c$cpp$cmake$cobol$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$gradle$haskell$haxe$java$julia$kotlin$lua$maven$meson$mojo$nim$nodejs$ocaml$odin$opa$perl$php$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$typst$vlang$xmake$zig$crystal$line_break$character'

[directory]
format = '\[[$path]($style)\] '
truncation_length = 0
truncate_to_repo = false
home_symbol = '~'

[git_branch]
format = '\[[git:$branch]($style)\] '

[git_status]
format = '(\[[$all_status$ahead_behind]($style)\] )'
conflicted = 'conflict:${count} '
ahead = 'ahead:${count} '
behind = 'behind:${count} '
diverged = 'ahead:${ahead_count} behind:${behind_count} '
untracked = '?:${count}'
stashed = 'stash:${count} '
modified = '!:${count} '
staged = '+:${count} '
renamed = 'rename:${count} '
deleted = '-:${count} '

[character]
success_symbol = '[>](bold green)'
error_symbol = '[>](bold red)'
vimcmd_symbol = '[>](bold green)'

[cmd_duration]
disabled = true

[bun]
format = '\[[bun:$version]($style)\] '

